#---------------------------------------------------------------------------
# One-off hack, not for merging: try to reproduce macOS-only issues #2840,
# #2965 and #2966 on GitHub's macOS runners using released wxPython wheels
# from PyPI plus the demo folder from the matching release tag.
#
# Results are in each job's summary; screenshots are in the artifacts.
#---------------------------------------------------------------------------

name: macos-repro

on:
  push:
    branches: [ 'macos_repro' ]

  workflow_dispatch:
    inputs:
      runners:
        description: 'JSON list of macOS runner labels'
        default: '["macos-15", "macos-26"]'
      python_versions:
        description: 'JSON list of Python versions'
        default: '["3.12", "3.13"]'
      wx_versions:
        description: 'JSON list of wxPython versions (PyPI releases with a wxPython-X tag)'
        default: '["4.2.5", "4.3.1", "4.3.2"]'

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: 1

jobs:
  repro:
    name: ${{ matrix.os }} py${{ matrix.python }} wx${{ matrix.wx }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runners || '["macos-15", "macos-26"]') }}
        python: ${{ fromJSON(inputs.python_versions || '["3.12", "3.13"]') }}
        wx: ${{ fromJSON(inputs.wx_versions || '["4.2.5", "4.3.1", "4.3.2"]') }}

    steps:
      - name: Checkout harness
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/macos-repro

      - name: Checkout demo for wxPython ${{ matrix.wx }}
        uses: actions/checkout@v6
        with:
          repository: wxWidgets/Phoenix
          ref: wxPython-${{ matrix.wx }}
          sparse-checkout: demo
          path: wx-src

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install wxPython ${{ matrix.wx }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install "wxPython==${{ matrix.wx }}" pyobjc-framework-Cocoa

      - name: Run repro scenarios
        env:
          REPRO_DEMO: ${{ github.workspace }}/wx-src/demo
          REPRO_OUT: ${{ github.workspace }}/repro-out
        run: python .github/macos-repro/repro.py all

      - name: Add results to job summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.os }} / Python ${{ matrix.python }} / wxPython ${{ matrix.wx }}"
            echo '```'
            cat repro-out/summary.txt || echo 'no summary.txt'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repro-${{ matrix.os }}-py${{ matrix.python }}-wx${{ matrix.wx }}
          path: repro-out
